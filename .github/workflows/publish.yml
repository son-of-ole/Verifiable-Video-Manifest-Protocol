name: Publish VVMP Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: vvmp-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package installation path
        run: npm run verify:package-install

      - name: Publish package workspaces
        run: npm run publish:packages
