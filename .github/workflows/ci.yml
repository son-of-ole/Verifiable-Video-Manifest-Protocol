name: VVMP CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: vvmp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-e2e:
    name: Verify End To End
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run repository verification
        env:
          VVMP_TRUSTED_C2PA_SIGNING_PROFILE: ${{ secrets.VVMP_TRUSTED_C2PA_SIGNING_PROFILE }}
          VVMP_TRUSTED_C2PA_CERTIFICATE_PEM_B64: ${{ secrets.VVMP_TRUSTED_C2PA_CERTIFICATE_PEM_B64 }}
          VVMP_TRUSTED_C2PA_PRIVATE_KEY_PEM_B64: ${{ secrets.VVMP_TRUSTED_C2PA_PRIVATE_KEY_PEM_B64 }}
          VVMP_TRUSTED_C2PA_TRUST_PROGRAM: ${{ vars.VVMP_TRUSTED_C2PA_TRUST_PROGRAM }}
          VVMP_TRUSTED_C2PA_ALGORITHM: ${{ vars.VVMP_TRUSTED_C2PA_ALGORITHM }}
          VVMP_TRUSTED_C2PA_TSA_URL: ${{ vars.VVMP_TRUSTED_C2PA_TSA_URL }}
          VVMP_TRUSTED_C2PA_PROFILE_ID: ${{ vars.VVMP_TRUSTED_C2PA_PROFILE_ID }}
        run: npm run verify:e2e
